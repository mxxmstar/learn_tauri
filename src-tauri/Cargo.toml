[package]
name = "learn_tauri"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "learn_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ========== 日志核心 ==========
tracing = "0.1"

# ========== 日志处理 ==========
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "ansi"] }
tracing-appender = "0.2"

# ========== 时间处理 ==========
time = { version = "0.3", features = ["formatting", "macros"] }

# ========== 错误处理 ==========
anyhow = "1"
thiserror = "1"

# ========== OpenGL 学习 ==========
glfw = "0.60"
gl = "0.14"

# ========== 图片处理（用于纹理加载） ==========
image = "0.25"

# ========== 异步运行时 ==========
tokio = { version = "1", features = ["full"] }

# ========== 异步工具库 ==========
# tokio-util 提供 codec（帧化编解码）、用于解决 TCP 粘包/半包问题
#   - codec: 提供 LengthDelimitedCodec 等编解码器
tokio-util = { version = "0.7", features = ["codec"] }

# ========== 字节缓冲库 ==========
# bytes 提供零拷贝的字节缓冲区，是 tokio-util codec 的输出类型
bytes = "1"

# ========== 异步抽象库 ==========
# futures-util 提供 Stream / Sink 等 trait，用于 Framed 的读写分离
#   - sink: 启用 SinkExt 和 split() 功能（Framed 读写分离必需）
futures-util = { version = "0.3", features = ["sink"] }

# ========== HTTP 服务框架 ==========
# axum 是基于 tokio + hyper 的 Web 框架，由 tokio 团队维护
# features 说明：
#   - macros: 提供 #[debug_handler] 等宏
#   - json: 支持 JSON 请求/响应自动序列化
axum = { version = "0.7", features = ["macros", "json"] }

# ========== HTTP 工具库 ==========
# tower 提供 Service / Layer 抽象，是 axum 中间件的基础
tower = "0.5"
# tower-http 提供常用的 HTTP 中间件（日志、CORS、压缩等）
tower-http = { version = "0.6", features = ["trace", "cors", "fs"] }

# ========== UUID 生成 ==========
# 用于生成请求 ID
uuid = { version = "1", features = ["v4"] }

# ========== HTTP 客户端 ==========
# reqwest 是 Rust 最流行的 HTTP 客户端库，基于 tokio 异步运行时
# features 说明：
#   - json: 支持 JSON 请求/响应自动序列化/反序列化
#   - multipart: 支持 multipart/form-data 文件上传
reqwest = { version = "0.12", features = ["json", "multipart"] }

